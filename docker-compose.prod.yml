# Production-oriented Compose override
#
# Usage (does not replace the default development workflow):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# This file removes bind mounts, enables restart policies, and applies stricter
# resource defaults suitable for staging/production-like deployments.

services:
  backend:
    restart: unless-stopped
    volumes: !override
      - backend_vendor:/var/www/html/vendor

  queue:
    restart: unless-stopped
    volumes: !override
      - backend_vendor:/var/www/html/vendor

  scheduler:
    restart: unless-stopped
    volumes: !override
      - backend_vendor:/var/www/html/vendor

  frontend:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    volumes: !override
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
