services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/html/docs:ro
      - backend_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --no-ansi | grep -q Application"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [wsa]

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [wsa]

  nginx:
    build: ./nginx
    ports:
      - "8079:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [wsa]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wsa_enterprise
      POSTGRES_USER: wsa
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsa -d wsa_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wsa]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wsa]

  queue:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
      QUEUE_CONNECTION: redis
    command: >
      php artisan queue:work redis
      --queue=default
      --sleep=3
      --tries=3
      --timeout=90
      --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/html/docs:ro
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[a]rtisan queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [wsa]

  scheduler:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[a]rtisan schedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [wsa]

  backend-test:
    profiles: [test]
    build: ./backend
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: wsa_enterprise_test
      DB_USERNAME: wsa
      DB_PASSWORD: secret
      FORBIDDEN_TEST_DATABASES: wsa_enterprise
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AI_ASYNC_DISPATCH: "false"
      AI_QUOTA_ENABLED: "false"
      OPENAPI_SPEC_PATH: /var/www/docs/openapi.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/docs:ro
      - .:/var/www/repo:ro
      - backend_vendor:/var/www/html/vendor
    command: php artisan test --no-ansi
    networks: [wsa]

volumes:
  backend_vendor:
  postgres_data:
  redis_data:

networks:
  wsa:
    driver: bridge
