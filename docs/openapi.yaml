openapi: 3.1.0
info:
  title: WSA Enterprise API
  version: 1.0.0
  description: |
    REST API for WSA Enterprise — multi-tenant agricultural platform.
    See docs/api-conventions.md for response formats and authentication.
servers:
  - url: http://localhost:8081/api/v1
    description: Docker staging (Nginx gateway)
tags:
  - name: Auth
  - name: Users
  - name: Platform
  - name: Projects
  - name: Tasks
  - name: Farms
  - name: Crops
  - name: Soil
  - name: Training
  - name: Library
  - name: Diagnosis
  - name: Audit
  - name: AI
  - name: Billing
  - name: Teams
  - name: Notifications
  - name: Analytics
  - name: API Clients
  - name: Monitoring
  - name: Jobs
  - name: Beekeeping
  - name: AI Assistant
  - name: Marketing
  - name: Marketplace
  - name: Communications
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    apiClientBearer:
      type: http
      scheme: bearer
      description: |
        Organization API client credentials encoded as `{client_id}:{client_secret}`.
        Requires scopes matching the endpoint (e.g. `analytics.read`).
  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: integer
      description: Active organization for tenant-scoped requests
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted for this organization or action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (includes cross-tenant isolation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
    MarketplacePublicListing:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        seller_type: { type: string, enum: [local, international] }
        price: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        export_ready: { type: boolean }
        export_destination: { type: string, nullable: true }
        contact_access_price: { type: string, nullable: true }
        contact_access_currency: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        category:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            slug: { type: string }
            name: { type: string }
            name_ar: { type: string, nullable: true }
        seller:
          type: object
          properties:
            display_name: { type: string, nullable: true }
            country: { type: string, nullable: true }
            city: { type: string, nullable: true }
            seller_type: { type: string }
            verified: { type: boolean }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              path: { type: string }
              alt_text: { type: string, nullable: true }
              sort_order: { type: integer }
        contact_access_required: { type: boolean }
        contact:
          type: object
          properties:
            seller_email: { type: string, nullable: true }
            seller_phone: { type: string, nullable: true }
            seller_display_name: { type: string, nullable: true }
    MarketplaceOwnerListing:
      allOf:
        - $ref: '#/components/schemas/MarketplacePublicListing'
        - type: object
          properties:
            status: { type: string, enum: [draft, pending_review, published, rejected, suspended] }
            seller_email: { type: string, nullable: true }
            seller_phone: { type: string, nullable: true }
            export_metadata: { type: object, nullable: true, additionalProperties: true }
            organization_id: { type: integer, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    MarketplaceListingWrite:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        seller_type: { type: string, enum: [local, international] }
        price: { type: number, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        country: { type: string, maxLength: 100, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        seller_display_name: { type: string, maxLength: 255, nullable: true }
        seller_email: { type: string, format: email, nullable: true }
        seller_phone: { type: string, maxLength: 50, nullable: true }
        export_ready: { type: boolean }
        export_destination: { type: string, maxLength: 255, nullable: true }
        export_metadata: { type: object, nullable: true, additionalProperties: true }
        contact_access_price: { type: number, minimum: 0, nullable: true }
    MarketplaceCategory:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        name_ar: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        sort_order: { type: integer }
    MarketplaceContactAccessOrder:
      type: object
      properties:
        id: { type: integer }
        buyer_user_id: { type: integer }
        seller_user_id: { type: integer }
        listing_id: { type: integer }
        amount: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        payment_status: { type: string, enum: [pending, paid, failed] }
        payment_provider: { type: string, nullable: true }
        payment_reference: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
    MarketplacePaginatedListings:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketplacePublicListing'
        current_page: { type: integer }
        last_page: { type: integer }
        total: { type: integer }
paths:
  /health:
    get:
      tags: [Platform]
      summary: Legacy API health check (backward compatible)
      description: "Returns `{status: ok}` when all readiness dependencies are healthy; otherwise 503 with degraded status. When APP_DEBUG is false, check messages are generic and omit internal exception details."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  checks:
                    type: object
                    additionalProperties:
                      type: object
  /health/live:
    get:
      tags: [Platform]
      summary: Liveness probe
      description: Lightweight process liveness check without dependency verification.
      responses:
        '200':
          description: Application process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
  /health/ready:
    get:
      tags: [Platform]
      summary: Readiness probe
      description: Verifies database, cache, queue, storage, scheduler, and authentication dependencies. Failed check messages are sanitized when APP_DEBUG is false.
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  checks:
                    type: object
                    additionalProperties:
                      type: object
        '503':
          description: Not ready — one or more dependency checks failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  checks:
                    type: object
                    additionalProperties:
                      type: object
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Rate limit exceeded
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (disabled when ALLOW_REGISTRATION=false)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                device_name: { type: string }
      responses:
        '200':
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Registration disabled
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email if the address exists
      description: Always returns 200 to avoid account enumeration. Used by the Phase 3 React forgot-password page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic acknowledgement }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '200': { description: Password reset }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
  /auth/google/redirect:
    get:
      tags: [Auth]
      summary: Start Google OAuth and return the authorization URL
      responses:
        '200':
          description: Redirect URL and state
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  state: { type: string }
        '503': { description: Google OAuth is not connected }
  /auth/google/callback:
    post:
      tags: [Auth]
      summary: Exchange Google OAuth code for a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Google OAuth is not connected }
  /auth/phone/send-otp:
    post:
      tags: [Auth]
      summary: Send a phone login OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, maxLength: 32 }
      responses:
        '200': { description: OTP queued or sent }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
        '503': { description: SMS provider is not connected }
  /auth/phone/verify-otp:
    post:
      tags: [Auth]
      summary: Verify phone OTP and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                name: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403': { description: Registration disabled for new phone users }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/accept-invitation:
    post:
      tags: [Auth]
      summary: Accept organization invitation and authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                name: { type: string, maxLength: 255 }
                password: { type: string, format: password, minLength: 8 }
                device_name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Invitation accepted
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active bearer sessions for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session list
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{token}:
    delete:
      tags: [Auth]
      summary: Revoke a non-current bearer session
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Session revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Cannot revoke active session
  /invitations:
    get:
      tags: [Users]
      summary: List pending organization invitations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Pending invitations
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Invite a user to the organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, member] }
      responses:
        '201':
          description: Invitation created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{invitation}:
    delete:
      tags: [Users]
      summary: Revoke a pending invitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: invitation
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Invitation revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /user:
    get:
      tags: [Auth]
      summary: Current authenticated user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  email: { type: string, format: email }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags: [Platform]
      summary: Organization dashboard summary
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Dashboard metrics
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/organizations:
    get:
      tags: [Platform]
      summary: List organizations for authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization list
        '401':
          $ref: '#/components/responses/Unauthorized'
  /platform/me:
    get:
      tags: [Platform]
      summary: Current user context and permissions for active organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: User, roles, and permissions
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/access-summary:
    get:
      tags: [Platform]
      summary: Enterprise dashboard summary metrics
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization, AI, audit, and system summary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users:
    get:
      tags: [Users]
      summary: List organization members
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: page
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Users with roles
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user and attach to organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{user}/roles:
    post:
      tags: [Users]
      summary: Assign role to user within organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        '200':
          description: Role assigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{user}:
    get:
      tags: [Users]
      summary: Get organization member details
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User with membership and roles
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update organization member
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                membership_role: { type: string, enum: [admin, member] }
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated user
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Remove user from organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{user}/roles/{role}:
    delete:
      tags: [Users]
      summary: Unassign role from user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
        - name: role
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Role unassigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organization:
    get:
      tags: [Platform]
      summary: Current organization profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization profile
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Platform]
      summary: Update organization profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        '200':
          description: Updated organization
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organization/settings:
    get:
      tags: [Platform]
      summary: Organization settings (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Settings map
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Platform]
      summary: Update organization settings (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /monitoring/health:
    get:
      tags: [Monitoring]
      summary: Administrator health overview
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Component health statuses
        '403':
          $ref: '#/components/responses/Forbidden'
