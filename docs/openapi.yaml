openapi: 3.1.0
info:
  title: WSA Enterprise API
  version: 1.0.0
  description: |
    REST API for WSA Enterprise — multi-tenant agricultural platform.
    See docs/api-conventions.md for response formats and authentication.
servers:
  - url: http://localhost:8081/api/v1
    description: Docker staging (Nginx gateway)
tags:
  - name: Auth
  - name: Users
  - name: Platform
  - name: Projects
  - name: Tasks
  - name: Farms
  - name: Diagnosis
  - name: Audit
  - name: AI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: integer
      description: Active organization for tenant-scoped requests
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted for this organization or action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (includes cross-tenant isolation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
paths:
  /health:
    get:
      tags: [Platform]
      summary: API health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Rate limit exceeded
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (disabled when ALLOW_REGISTRATION=false)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                device_name: { type: string }
      responses:
        '200':
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Registration disabled
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user:
    get:
      tags: [Auth]
      summary: Current authenticated user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  email: { type: string, format: email }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags: [Platform]
      summary: Organization dashboard summary
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Dashboard metrics
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/organizations:
    get:
      tags: [Platform]
      summary: List organizations for authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization list
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Users]
      summary: List organization members
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: page
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Users with roles
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user and attach to organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{user}/roles:
    post:
      tags: [Users]
      summary: Assign role to user within organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        '200':
          description: Role assigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    get:
      tags: [Projects]
      summary: List projects for active organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Project list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{task}/status:
    patch:
      tags: [Tasks]
      summary: Update task status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: task
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /farm/{module}:
    get:
      tags: [Farms]
      summary: List farm module records
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: module
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Records
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Farms]
      summary: Create farm module record
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [farms, regions, fields, blocks, greenhouses, irrigation-zones, gps-coordinates, gis-maps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Module-specific payload (see FarmController validation rules)
      responses:
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /farm/{module}/{id}:
    put:
      tags: [Farms]
      summary: Update farm module record
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: module
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Farms]
      summary: Delete farm module record
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: module
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /diagnosis/requests:
    get:
      tags: [Diagnosis]
      summary: List diagnosis requests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Requests
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Diagnosis]
      summary: Submit diagnosis request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, subject_id]
              properties:
                reference: { type: string }
                subject_id: { type: integer }
                field_id: { type: integer }
                block_id: { type: integer }
                crop_type_id: { type: integer }
                disease_id: { type: integer }
                notes: { type: string }
                image_path: { type: string }
      responses:
        '201':
          description: Created
        '422':
          $ref: '#/components/responses/ValidationError'
  /diagnosis/requests/{id}:
    get:
      tags: [Diagnosis]
      summary: Show diagnosis request with results
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Diagnosis request detail
        '404':
          $ref: '#/components/responses/NotFound'
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs for active organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: action
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Envelope response with audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /roles:
    get:
      tags: [Users]
      summary: List roles for organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Role list
  /permissions:
    get:
      tags: [Users]
      summary: List permissions for organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Permission list
  /ai/provider:
    get:
      tags: [AI]
      summary: AI provider metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Provider info including async_dispatch flag
  /ai/requests:
    get:
      tags: [AI]
      summary: List AI requests for organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Paginated AI requests
    post:
      tags: [AI]
      summary: Submit AI request (201 sync, 202 async)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type, input]
              properties:
                request_type: { type: string }
                input: { type: object }
      responses:
        '201':
          description: Completed synchronously
        '202':
          description: Accepted (pending)
  /ai/requests/{id}:
    get:
      tags: [AI]
      summary: Show AI request status and output
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: AI request detail
        '404':
          $ref: '#/components/responses/NotFound'
